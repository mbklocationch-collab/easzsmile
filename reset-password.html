<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser ton mot de passe — eazy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #F4F7F6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 36px 28px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(11,17,32,0.08);
    text-align: center;
  }
  .logo {
    width: 64px;
    height: 64px;
    background: #0B1120;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 28px;
  }
  h1 { font-size: 20px; color: #0B1120; margin-bottom: 8px; }
  p.subtitle { font-size: 14px; color: #8A96B0; margin-bottom: 24px; line-height: 1.5; }
  input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #E2EBE7;
    border-radius: 14px;
    font-size: 15px;
    margin-bottom: 14px;
    outline: none;
  }
  input:focus { border-color: #00C896; }
  button {
    width: 100%;
    padding: 16px;
    background: #00C896;
    color: #fff;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { font-size: 13.5px; margin-top: 16px; line-height: 1.5; }
  .msg.error { color: #FF4B4B; }
  .msg.success { color: #00A87A; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🙂</div>
    <h1>Nouveau mot de passe</h1>
    <p class="subtitle" id="subtitle">Choisis un nouveau mot de passe pour ton compte eazy.</p>

    <div id="form-area">
      <input type="password" id="password" placeholder="Nouveau mot de passe (6 car. min.)" />
      <input type="password" id="password2" placeholder="Confirme le mot de passe" />
      <button id="submitBtn" onclick="resetPassword()">Valider</button>
    </div>

    <div class="msg" id="message"></div>
  </div>

  <script>
    // Remplace par tes propres identifiants Supabase (les mêmes que dans App.js)
    const SUPABASE_URL = 'https://racskypzqyphrixjbasf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhY3NreXB6cXlwaHJpeGpiYXNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5OTEwODgsImV4cCI6MjA5NzU2NzA4OH0.az31U8wWWINKkdgUzvyTQ-Z0348HsfXhhGxog82zvs4';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function resetPassword() {
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const messageEl = document.getElementById('message');
      const btn = document.getElementById('submitBtn');

      messageEl.textContent = '';
      messageEl.className = 'msg';

      if (!password || password.length < 6) {
        messageEl.textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
        messageEl.classList.add('error');
        return;
      }
      if (password !== password2) {
        messageEl.textContent = 'Les deux mots de passe ne correspondent pas.';
        messageEl.classList.add('error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Validation...';

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        messageEl.textContent = "Erreur : " + error.message + " — le lien a peut-être expiré, redemande un nouveau mot de passe depuis l'app.";
        messageEl.classList.add('error');
        btn.disabled = false;
        btn.textContent = 'Valider';
      } else {
        document.getElementById('form-area').style.display = 'none';
        document.getElementById('subtitle').style.display = 'none';
        messageEl.textContent = '✅ Mot de passe modifié avec succès ! Tu peux retourner sur l\'app eazy et te connecter avec ton nouveau mot de passe.';
        messageEl.classList.add('success');
      }
    }
  </script>
</body>
</html>
