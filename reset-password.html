<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser ton mot de passe — eazy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #F4F7F6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 36px 28px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(11,17,32,0.08);
    text-align: center;
  }
  .logo {
    width: 64px;
    height: 64px;
    background: #0B1120;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 28px;
  }
  h1 { font-size: 20px; color: #0B1120; margin-bottom: 8px; }
  p.subtitle { font-size: 14px; color: #8A96B0; margin-bottom: 24px; line-height: 1.5; }
  input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #E2EBE7;
    border-radius: 14px;
    font-size: 15px;
    margin-bottom: 14px;
    outline: none;
  }
  input:focus { border-color: #00C896; }
  button {
    width: 100%;
    padding: 16px;
    background: #00C896;
    color: #fff;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { font-size: 13.5px; margin-top: 16px; line-height: 1.5; }
  .msg.error { color: #FF4B4B; }
  .msg.success { color: #00A87A; font-weight: 600; }
  .debug { font-size: 13px; color: #0B1120; margin-top: 20px; word-break: break-all; text-align: left; background: #FFF3CD; padding: 14px; border-radius: 8px; border: 2px solid #FF9B3C; font-weight: 700; min-height: 20px; }
  .debug:before { content: "🔧 DIAGNOSTIC : "; color: #FF4B4B; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🙂</div>
    <h1>Nouveau mot de passe</h1>
    <p class="subtitle" id="subtitle">Choisis un nouveau mot de passe pour ton compte eazy.</p>

    <div id="form-area">
      <input type="password" id="password" placeholder="Nouveau mot de passe (6 car. min.)" />
      <input type="password" id="password2" placeholder="Confirme le mot de passe" />
      <button id="submitBtn" onclick="handleClick()">Valider</button>
    </div>

    <div class="msg" id="message"></div>
    <div class="debug" id="debug">Chargement de la page en cours...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://racskypzqyphrixjbasf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhY3NreXB6cXlwaHJpeGpiYXNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5OTEwODgsImV4cCI6MjA5NzU2NzA4OH0.az31U8wWWINKkdgUzvyTQ-Z0348HsfXhhGxog82zvs4';

    let supabase = null;
    let sessionReady = false;

    function showDebug(text) {
      const d = document.getElementById('debug');
      d.textContent = (d.textContent ? d.textContent + ' | ' : '') + text;
    }

    function showMessage(text, isError) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = 'msg ' + (isError ? 'error' : 'success');
    }

    document.addEventListener('DOMContentLoaded', function() {
      try {
        if (!window.supabase || !window.supabase.createClient) {
          throw new Error('Le script Supabase ne s\'est pas chargé (window.supabase manquant).');
        }
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        showDebug('Client Supabase initialisé OK');
      } catch (e) {
        showDebug('ERREUR INIT: ' + e.message);
        showMessage('Erreur de chargement de la page (' + e.message + '). Vérifie ta connexion et recharge la page.', true);
      }

      if (supabase) {
        establishSession();
      }
    });

    // Filet de sécurité supplémentaire : si après 6 secondes le script externe
    // n'a toujours pas répondu (réseau lent, domaine bloqué...), on l'affiche
    // clairement au lieu de laisser la page silencieuse indéfiniment.
    setTimeout(() => {
      if (!supabase) {
        showDebug('TIMEOUT : le script Supabase ne répond toujours pas après 6 secondes.');
        showMessage("Le chargement prend anormalement longtemps. Vérifie ta connexion internet, ou réessaie avec un autre réseau (WiFi/données mobiles).", true);
      }
    }, 6000);

    async function establishSession() {
      if (!supabase) return;
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace('#', '?'));
      showDebug('URL params: ' + window.location.search.slice(0, 60) + ' hash: ' + window.location.hash.slice(0, 60));

      try {
        if (params.get('code')) {
          const { error } = await supabase.auth.exchangeCodeForSession(window.location.href);
          if (error) throw error;
          sessionReady = true;
          showDebug('Session établie via code');
        } else if (hashParams.get('access_token')) {
          const { error } = await supabase.auth.setSession({
            access_token: hashParams.get('access_token'),
            refresh_token: hashParams.get('refresh_token'),
          });
          if (error) throw error;
          sessionReady = true;
          showDebug('Session établie via access_token');
        } else {
          const { data } = await supabase.auth.getSession();
          if (data && data.session) {
            sessionReady = true;
            showDebug('Session déjà existante');
          } else {
            showDebug('Aucun code ni token trouvé dans le lien');
          }
        }
      } catch (e) {
        showDebug('ERREUR SESSION: ' + e.message);
      }

      if (!sessionReady) {
        showMessage("Ce lien a expiré ou n'est plus valide. Retourne dans l'app eazy et redemande un nouveau lien via 'Mot de passe oublié ?'.", true);
        document.getElementById('form-area').style.display = 'none';
      }
    }

    function handleClick() {
      resetPassword().catch(e => {
        showDebug('ERREUR CATCH GLOBAL: ' + e.message);
        showMessage('Une erreur inattendue est survenue : ' + e.message, true);
        const btn = document.getElementById('submitBtn');
        btn.disabled = false;
        btn.textContent = 'Valider';
      });
    }

    async function resetPassword() {
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const btn = document.getElementById('submitBtn');

      showMessage('', false);

      if (!supabase) {
        showMessage("La page n'a pas pu se charger correctement. Recharge la page et réessaie.", true);
        return;
      }
      if (!sessionReady) {
        showMessage("Session non établie — recharge la page ou redemande un nouveau lien depuis l'app.", true);
        return;
      }
      if (!password || password.length < 6) {
        showMessage('Le mot de passe doit contenir au moins 6 caractères.', true);
        return;
      }
      if (password !== password2) {
        showMessage('Les deux mots de passe ne correspondent pas.', true);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Validation...';
      showDebug('Envoi de updateUser...');

      const { error } = await supabase.auth.updateUser({ password: password });

      if (error) {
        showDebug('ERREUR updateUser: ' + error.message);
        showMessage("Erreur : " + error.message + " — le lien a peut-être expiré, redemande un nouveau mot de passe depuis l'app.", true);
        btn.disabled = false;
        btn.textContent = 'Valider';
      } else {
        showDebug('updateUser réussi');
        document.getElementById('form-area').style.display = 'none';
        document.getElementById('subtitle').style.display = 'none';
        showMessage("✅ Mot de passe modifié avec succès ! Tu peux retourner sur l'app eazy et te connecter avec ton nouveau mot de passe.", false);
      }
    }
  </script>
</body>
</html>
